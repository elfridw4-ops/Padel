    <!-- Dynamic Origin Resolver for Social Link Sharing across Hostings (Vercel, Netlify, Custom Domain) -->
    <script>
      (function() {
        try {
          var origin = window.location.origin;
          var href = window.location.href;
          if (origin && !origin.startsWith('file:')) {
            var fullImgUrl = origin + '/og-image.jpg';
            var setAttr = function(selector, attr, val) {
              var el = document.querySelector(selector);
              if (el) el.setAttribute(attr, val);
            };
            setAttr('meta[property="og:url"]', 'content', href);
            setAttr('meta[property="og:image"]', 'content', fullImgUrl);
            setAttr('meta[property="og:image:secure_url"]', 'content', fullImgUrl);
            setAttr('meta[name="twitter:image"]', 'content', fullImgUrl);
            setAttr('meta[name="twitter:image:src"]', 'content', fullImgUrl);
          }
        } catch(e) {}
      })();
    </script>
